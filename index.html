<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pengumuman UM-PTKIN 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    #countdown {
      font-size: 32px;
      font-weight: bold;
      margin-top: 20px;
    }
    .box {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 15px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>PENGUMUMAN UM-PTKIN 2026</h1>
    <p>Hasil seleksi dapat dilihat pada:</p>
    <p><b>30 Juni 2026 pukul 15.00 WIB</b></p>

    <div id="countdown">Loading...</div>
  </div>

<script>
const targetDate = new Date("June 30, 2026 15:00:00").getTime();

const countdown = setInterval(function() {
  const now = new Date().getTime();
  const distance = targetDate - now;

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((distance / (1000 * 60)) % 60);
  const seconds = Math.floor((distance / 1000) % 60);

  document.getElementById("countdown").innerHTML =
    days + " hari " + hours + " jam " + minutes + " menit " + seconds + " detik";

  if (distance < 0) {
    clearInterval(countdown);
    document.getElementById("countdown").innerHTML = "PENGUMUMAN SUDAH TERSEDIA";
  }
}, 1000);
</script>

</body>
</html>
